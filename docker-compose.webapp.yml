# The webapp, containerised. The base docker-compose.yml has no webapp services
# at all - backend and frontend only ever ran by hand on the host.
#
#   local : docker compose -f docker-compose.yml -f docker-compose.webapp.yml up -d --build
#
# On a droplet, set PUBLIC_API_URL to the address a *browser* will use, e.g.
#   PUBLIC_API_URL=http://203.0.113.10:8500 docker compose ... up -d --build
# It is baked into the frontend bundle at build time, so changing it needs a
# rebuild, not just a restart.

services:
  webapp-backend:
    build:
      context: .
      dockerfile: docker/webapp-backend.Dockerfile
    image: a-opdt/webapp-backend:local
    container_name: a_opdt_webapp_backend
    ports:
      - "8500:8500"
    environment:
      # Browser origin allowed to call this API. Must match where the frontend
      # is served from, or every request fails CORS preflight.
      AOPDT_CORS_ORIGINS: "${PUBLIC_WEB_ORIGIN:-http://localhost:5173}"
      # Which env file dyon's TwinConfig reads. .env.cloud points at the
      # managed InfluxDB/Mongo/Neo4j; .env is the local stack.
      A_OPDT_ENV_FILE: "${A_OPDT_ENV_FILE:-.env}"
      DT_REDIS__URL: "redis://redis:6379"
      # NOT ${DT_MONGO__URI}: compose auto-loads a-opdt/.env for interpolation,
      # and that file says localhost:27017 - correct on the host, but inside a
      # container localhost is the container itself. Service name, always.
      # auth.py reads AOPDT_MONGO_URI first, then DT_MONGO__URI.
      DT_MONGO__URI: "mongodb://admin:password@mongodb:27017"
      AOPDT_MONGO_URI: "mongodb://admin:password@mongodb:27017"
    depends_on:
      - redis
      - mongodb
    restart: unless-stopped

  webapp-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8500}"
    image: a-opdt/webapp-frontend:local
    container_name: a_opdt_webapp_frontend
    ports:
      - "5173:80"
    depends_on:
      - webapp-backend
    restart: unless-stopped

# Mock Sensor Profiles for Maize A-OPDT
# Each sensor defines nominal ranges per growth stage.
# The mock publisher uses these to generate realistic time-series with
# Gaussian noise and optional drift/stress injection.
#
# Units follow the paper's sensor stack specification.

# ── Soil Sensors ──────────────────────────────────────────────────────────────
soil_moisture:
  unit: "m³/m³"          # volumetric water content (TDR)
  noise_std: 0.005
  by_stage:
    germination:       { nominal: 0.32, warn_low: 0.22, crit_low: 0.15 }
    vegetative_early:  { nominal: 0.30, warn_low: 0.20, crit_low: 0.13 }
    vegetative_late:   { nominal: 0.28, warn_low: 0.18, crit_low: 0.12 }
    anthesis:          { nominal: 0.30, warn_low: 0.22, crit_low: 0.15 }  # critical stage
    grain_fill:        { nominal: 0.27, warn_low: 0.20, crit_low: 0.13 }
    maturity:          { nominal: 0.22, warn_low: 0.14, crit_low: 0.09 }

soil_ec:
  unit: "dS/m"            # electrical conductivity (salinity proxy)
  noise_std: 0.02
  by_stage:
    germination:       { nominal: 0.8,  warn_high: 1.5, crit_high: 2.5 }
    vegetative_early:  { nominal: 0.9,  warn_high: 1.6, crit_high: 2.5 }
    vegetative_late:   { nominal: 1.0,  warn_high: 1.8, crit_high: 3.0 }
    anthesis:          { nominal: 1.0,  warn_high: 1.8, crit_high: 3.0 }
    grain_fill:        { nominal: 1.1,  warn_high: 2.0, crit_high: 3.2 }
    maturity:          { nominal: 1.2,  warn_high: 2.2, crit_high: 3.5 }

soil_nitrogen:
  unit: "mg/kg"           # plant-available N (ion-selective probe proxy)
  noise_std: 1.5
  by_stage:
    germination:       { nominal: 45.0, warn_low: 25.0, crit_low: 15.0 }
    vegetative_early:  { nominal: 55.0, warn_low: 30.0, crit_low: 20.0 }
    vegetative_late:   { nominal: 65.0, warn_low: 35.0, crit_low: 22.0 }
    anthesis:          { nominal: 50.0, warn_low: 28.0, crit_low: 18.0 }
    grain_fill:        { nominal: 40.0, warn_low: 22.0, crit_low: 14.0 }
    maturity:          { nominal: 25.0, warn_low: 10.0, crit_low: 5.0  }

soil_phosphorus:
  unit: "mg/kg"
  noise_std: 0.8
  by_stage:
    germination:       { nominal: 18.0, warn_low: 10.0, crit_low: 6.0 }
    vegetative_early:  { nominal: 20.0, warn_low: 11.0, crit_low: 7.0 }
    vegetative_late:   { nominal: 22.0, warn_low: 12.0, crit_low: 8.0 }
    anthesis:          { nominal: 20.0, warn_low: 11.0, crit_low: 7.0 }
    grain_fill:        { nominal: 16.0, warn_low: 9.0,  crit_low: 5.0 }
    maturity:          { nominal: 10.0, warn_low: 5.0,  crit_low: 3.0 }

soil_potassium:
  unit: "mg/kg"
  noise_std: 1.2
  by_stage:
    germination:       { nominal: 120.0, warn_low: 70.0,  crit_low: 40.0 }
    vegetative_early:  { nominal: 140.0, warn_low: 80.0,  crit_low: 45.0 }
    vegetative_late:   { nominal: 160.0, warn_low: 90.0,  crit_low: 50.0 }
    anthesis:          { nominal: 150.0, warn_low: 85.0,  crit_low: 48.0 }
    grain_fill:        { nominal: 130.0, warn_low: 72.0,  crit_low: 42.0 }
    maturity:          { nominal: 90.0,  warn_low: 50.0,  crit_low: 28.0 }

# ── Spectral / Hyperspectral ───────────────────────────────────────────────────
ndvi:
  unit: "dimensionless"   # Normalised Difference Vegetation Index [-1, 1]
  noise_std: 0.008
  by_stage:
    germination:       { nominal: 0.25, warn_low: 0.15, crit_low: 0.08 }
    vegetative_early:  { nominal: 0.55, warn_low: 0.38, crit_low: 0.25 }
    vegetative_late:   { nominal: 0.78, warn_low: 0.58, crit_low: 0.42 }
    anthesis:          { nominal: 0.82, warn_low: 0.62, crit_low: 0.46 }
    grain_fill:        { nominal: 0.75, warn_low: 0.55, crit_low: 0.38 }
    maturity:          { nominal: 0.45, warn_low: 0.28, crit_low: 0.15 }

pri:
  unit: "dimensionless"   # Photochemical Reflectance Index — xanthophyll activity
  noise_std: 0.003
  by_stage:
    germination:       { nominal: 0.02,  warn_low: 0.00,  crit_low: -0.02 }
    vegetative_early:  { nominal: 0.04,  warn_low: 0.01,  crit_low: -0.01 }
    vegetative_late:   { nominal: 0.06,  warn_low: 0.02,  crit_low:  0.00 }
    anthesis:          { nominal: 0.07,  warn_low: 0.02,  crit_low:  0.00 }
    grain_fill:        { nominal: 0.05,  warn_low: 0.01,  crit_low: -0.01 }
    maturity:          { nominal: 0.02,  warn_low: -0.01, crit_low: -0.03 }

red_edge_slope:
  unit: "dimensionless"   # Steepness of red-edge reflectance curve (chlorophyll proxy)
  noise_std: 0.004
  by_stage:
    germination:       { nominal: 0.18, warn_low: 0.10, crit_low: 0.06 }
    vegetative_early:  { nominal: 0.38, warn_low: 0.24, crit_low: 0.16 }
    vegetative_late:   { nominal: 0.55, warn_low: 0.38, crit_low: 0.26 }
    anthesis:          { nominal: 0.58, warn_low: 0.40, crit_low: 0.28 }
    grain_fill:        { nominal: 0.50, warn_low: 0.34, crit_low: 0.22 }
    maturity:          { nominal: 0.28, warn_low: 0.16, crit_low: 0.10 }

# ── Thermal IR ────────────────────────────────────────────────────────────────
canopy_temperature:
  unit: "°C"              # absolute canopy surface temperature
  noise_std: 0.15
  by_stage:
    germination:       { nominal: 26.0, warn_high: 32.0, crit_high: 36.0 }
    vegetative_early:  { nominal: 27.0, warn_high: 33.0, crit_high: 37.0 }
    vegetative_late:   { nominal: 28.0, warn_high: 34.0, crit_high: 38.0 }
    anthesis:          { nominal: 28.5, warn_high: 33.0, crit_high: 36.0 }  # tighter - pollen viability
    grain_fill:        { nominal: 29.0, warn_high: 35.0, crit_high: 39.0 }
    maturity:          { nominal: 30.0, warn_high: 38.0, crit_high: 42.0 }

canopy_air_delta:
  unit: "°C"              # Tc - Ta: positive = water stress, negative = well-watered
  noise_std: 0.10
  by_stage:
    germination:       { nominal: -0.5, warn_high: 1.5, crit_high: 3.5 }
    vegetative_early:  { nominal: -0.8, warn_high: 1.2, crit_high: 3.0 }
    vegetative_late:   { nominal: -1.0, warn_high: 1.0, crit_high: 2.8 }
    anthesis:          { nominal: -1.2, warn_high: 0.8, crit_high: 2.5 }
    grain_fill:        { nominal: -0.8, warn_high: 1.2, crit_high: 3.0 }
    maturity:          { nominal:  0.5, warn_high: 3.0, crit_high: 5.5 }

# ── Chlorophyll Fluorescence ───────────────────────────────────────────────────
fv_fm:
  unit: "dimensionless"   # Maximum quantum yield of PSII [0–0.83 healthy]
  noise_std: 0.005
  by_stage:
    germination:       { nominal: 0.76, warn_low: 0.70, crit_low: 0.65 }
    vegetative_early:  { nominal: 0.79, warn_low: 0.73, crit_low: 0.67 }
    vegetative_late:   { nominal: 0.81, warn_low: 0.75, crit_low: 0.68 }
    anthesis:          { nominal: 0.82, warn_low: 0.76, crit_low: 0.69 }
    grain_fill:        { nominal: 0.80, warn_low: 0.74, crit_low: 0.67 }
    maturity:          { nominal: 0.72, warn_low: 0.64, crit_low: 0.56 }

phi_psii:
  unit: "dimensionless"   # Effective quantum yield of PSII under ambient light
  noise_std: 0.008
  by_stage:
    germination:       { nominal: 0.55, warn_low: 0.42, crit_low: 0.30 }
    vegetative_early:  { nominal: 0.62, warn_low: 0.48, crit_low: 0.34 }
    vegetative_late:   { nominal: 0.68, warn_low: 0.52, crit_low: 0.38 }
    anthesis:          { nominal: 0.70, warn_low: 0.54, crit_low: 0.40 }
    grain_fill:        { nominal: 0.65, warn_low: 0.50, crit_low: 0.36 }
    maturity:          { nominal: 0.50, warn_low: 0.36, crit_low: 0.24 }

# ── VOC / E-nose ──────────────────────────────────────────────────────────────
ethylene:
  unit: "ppb"             # stress hormone — rises under drought, wounding, pathogen
  noise_std: 0.08
  by_stage:
    germination:       { nominal: 0.4,  warn_high: 1.2,  crit_high: 2.5  }
    vegetative_early:  { nominal: 0.5,  warn_high: 1.5,  crit_high: 3.0  }
    vegetative_late:   { nominal: 0.6,  warn_high: 1.8,  crit_high: 3.5  }
    anthesis:          { nominal: 0.6,  warn_high: 1.6,  crit_high: 3.2  }
    grain_fill:        { nominal: 0.7,  warn_high: 2.0,  crit_high: 4.0  }
    maturity:          { nominal: 1.2,  warn_high: 3.0,  crit_high: 6.0  }

isoprene:
  unit: "ppb"             # heat stress marker — rises steeply above 35°C
  noise_std: 0.5
  by_stage:
    germination:       { nominal: 2.0,  warn_high: 6.0,  crit_high: 12.0 }
    vegetative_early:  { nominal: 3.0,  warn_high: 8.0,  crit_high: 16.0 }
    vegetative_late:   { nominal: 5.0,  warn_high: 12.0, crit_high: 22.0 }
    anthesis:          { nominal: 5.5,  warn_high: 11.0, crit_high: 20.0 }
    grain_fill:        { nominal: 4.5,  warn_high: 10.0, crit_high: 18.0 }
    maturity:          { nominal: 3.0,  warn_high: 8.0,  crit_high: 15.0 }

hexenal:
  unit: "ppb"             # (E)-2-hexenal — green leaf volatile, rises on pest/wounding
  noise_std: 0.15
  by_stage:
    germination:       { nominal: 0.8,  warn_high: 2.5,  crit_high: 5.0  }
    vegetative_early:  { nominal: 1.2,  warn_high: 3.5,  crit_high: 7.0  }
    vegetative_late:   { nominal: 1.8,  warn_high: 5.0,  crit_high: 10.0 }
    anthesis:          { nominal: 1.5,  warn_high: 4.5,  crit_high: 9.0  }
    grain_fill:        { nominal: 1.3,  warn_high: 4.0,  crit_high: 8.0  }
    maturity:          { nominal: 1.0,  warn_high: 3.0,  crit_high: 6.0  }

# ── Atmospheric ───────────────────────────────────────────────────────────────
air_temperature:
  unit: "°C"
  noise_std: 0.2
  by_stage:             # ambient — same across all stages, driven by diurnal cycle
    germination:       { nominal: 27.0, warn_high: 35.0, crit_high: 40.0 }
    vegetative_early:  { nominal: 27.0, warn_high: 35.0, crit_high: 40.0 }
    vegetative_late:   { nominal: 28.0, warn_high: 36.0, crit_high: 41.0 }
    anthesis:          { nominal: 28.0, warn_high: 34.0, crit_high: 38.0 }
    grain_fill:        { nominal: 28.0, warn_high: 36.0, crit_high: 41.0 }
    maturity:          { nominal: 27.0, warn_high: 36.0, crit_high: 41.0 }

relative_humidity:
  unit: "%"
  noise_std: 1.2
  by_stage:
    germination:       { nominal: 72.0, warn_low: 45.0, crit_low: 30.0 }
    vegetative_early:  { nominal: 70.0, warn_low: 42.0, crit_low: 28.0 }
    vegetative_late:   { nominal: 68.0, warn_low: 40.0, crit_low: 26.0 }
    anthesis:          { nominal: 65.0, warn_low: 40.0, crit_low: 28.0 }
    grain_fill:        { nominal: 65.0, warn_low: 38.0, crit_low: 24.0 }
    maturity:          { nominal: 60.0, warn_low: 35.0, crit_low: 20.0 }

co2:
  unit: "ppm"
  noise_std: 3.0
  by_stage:             # ambient CO2 — relatively stable, slight photosynthesis dip midday
    germination:       { nominal: 415.0, warn_low: 380.0, crit_low: 350.0 }
    vegetative_early:  { nominal: 415.0, warn_low: 380.0, crit_low: 350.0 }
    vegetative_late:   { nominal: 412.0, warn_low: 375.0, crit_low: 345.0 }
    anthesis:          { nominal: 410.0, warn_low: 372.0, crit_low: 342.0 }
    grain_fill:        { nominal: 413.0, warn_low: 376.0, crit_low: 346.0 }
    maturity:          { nominal: 415.0, warn_low: 380.0, crit_low: 350.0 }

par:
  unit: "µmol/m²/s"    # Photosynthetically Active Radiation
  noise_std: 15.0
  by_stage:             # driven by diurnal cycle; same nominals across stages
    germination:       { nominal: 800.0, warn_low: 200.0, crit_low: 80.0 }
    vegetative_early:  { nominal: 900.0, warn_low: 220.0, crit_low: 90.0 }
    vegetative_late:   { nominal: 950.0, warn_low: 240.0, crit_low: 100.0 }
    anthesis:          { nominal: 950.0, warn_low: 240.0, crit_low: 100.0 }
    grain_fill:        { nominal: 920.0, warn_low: 230.0, crit_low: 95.0 }
    maturity:          { nominal: 850.0, warn_low: 200.0, crit_low: 80.0 }
